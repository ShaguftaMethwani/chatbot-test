name: Daily Mutual Fund Data Refresh

on:
  schedule:
    # Runs every day at 04:30 UTC (10:00 IST)
    - cron: '30 4 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  ingest:
    name: Scrape, Chunk, Embed & Commit Raw Data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ingestion pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          EMBEDDING_MODEL: all-MiniLM-L6-v2
          CHROMA_PERSIST_DIR: backend/data/chroma_db
          TOP_K: 3
          SIMILARITY_THRESHOLD: 0.35
        run: python scripts/ingest.py

      - name: Write job summary
        if: success()
        run: |
          echo "## ✅ Ingestion Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp (UTC):** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Raw data files updated:** $(ls backend/data/raw/*.json 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

      - name: Commit updated raw data
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backend/data/raw/*.json
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: daily fund data refresh $(date -u +%Y-%m-%d)"
            # Pull latest changes to avoid conflicts before pushing
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
