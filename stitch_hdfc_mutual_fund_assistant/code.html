<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HDFC Mutual Fund Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&amp;family=Sora:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#110c15",
                        "outline-variant": "#4d4354",
                        "background": "#16111b",
                        "surface-dim": "#16111b",
                        "surface": "#16111b",
                        "secondary-container": "#3131c0",
                        "surface-variant": "#39323d",
                        "on-primary-fixed-variant": "#6900b3",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-container": "#231e27",
                        "surface-container-highest": "#39323d",
                        "secondary-fixed": "#e1e0ff",
                        "inverse-primary": "#842bd2",
                        "inverse-on-surface": "#342e38",
                        "surface-container-low": "#1f1a23",
                        "on-error": "#690005",
                        "on-background": "#eadfed",
                        "primary": "#ddb7ff",
                        "secondary": "#c0c1ff",
                        "surface-tint": "#ddb7ff",
                        "tertiary-fixed": "#ffdead",
                        "on-surface": "#eadfed",
                        "primary-fixed-dim": "#ddb7ff",
                        "surface-container-high": "#2e2832",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#fabc4e",
                        "on-secondary-fixed-variant": "#2f2ebe",
                        "on-secondary-fixed": "#07006c",
                        "surface-bright": "#3d3741",
                        "on-primary-fixed": "#2c0051",
                        "on-secondary-container": "#b0b2ff",
                        "error-container": "#93000a",
                        "on-tertiary": "#432c00",
                        "outline": "#988d9f",
                        "on-tertiary-fixed": "#281900",
                        "inverse-surface": "#eadfed",
                        "primary-container": "#b76dff",
                        "primary-fixed": "#f0dbff",
                        "tertiary": "#fabc4e",
                        "tertiary-container": "#bd871a",
                        "on-secondary": "#1000a9",
                        "on-surface-variant": "#cfc2d6",
                        "error": "#ffb4ab",
                        "on-primary": "#490080",
                        "on-tertiary-fixed-variant": "#604100",
                        "on-tertiary-container": "#3a2600",
                        "on-primary-container": "#400071"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "sm": "8px",
                        "xl": "40px",
                        "md": "16px",
                        "container-padding": "24px",
                        "xs": "4px",
                        "chat-gap": "12px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Sora"],
                        "headline-md": ["Sora"],
                        "label-sm": ["Hanken Grotesk"],
                        "headline-xl-mobile": ["Sora"],
                        "headline-xl": ["Sora"],
                        "body-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-xl": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-modal {
            background-color: rgba(22, 17, 27, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 40px rgba(168, 85, 247, 0.05);
        }
        .gradient-btn {
            background: linear-gradient(135deg, theme('colors.primary-container'), theme('colors.secondary-container'));
            transition: all 0.3s ease;
        }
        .gradient-btn:hover {
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.3);
            transform: scale(1.02);
        }
        .user-bubble {
            background: linear-gradient(135deg, theme('colors.primary-container'), theme('colors.secondary-container'));
            color: theme('colors.on-primary-container');
        }
        
        .message-enter {
            animation: slideUpFade 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        
        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .typing-dot {
            animation: typing 1.4s infinite ease-in-out;
            fill: theme('colors.on-surface-variant');
        }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 100% { opacity: 0.2; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-2px); }
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden antialiased font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/10 shadow-sm flex justify-between items-center px-container-padding py-md">
<div class="flex flex-col">
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary">HDFC Mutual Fund Assistant</h1>
<p class="text-label-sm font-label-sm text-on-surface-variant mt-1">Answers are AI-generated based on official fund documents. Not investment advice.</p>
</div>
<div class="hidden md:flex gap-sm">
<button class="p-2 rounded-full hover:bg-white/5 transition-colors text-on-surface-variant hover:text-primary active:opacity-80 transition-all">
<span class="material-symbols-outlined" data-icon="info">info</span>
</button>
<button class="p-2 rounded-full hover:bg-white/5 transition-colors text-on-surface-variant hover:text-primary active:opacity-80 transition-all">
<span class="material-symbols-outlined" data-icon="help">help</span>
</button>
</div>
</header>
<!-- Main Chat Area -->
<main class="flex-1 overflow-y-auto no-scrollbar pt-[100px] pb-[140px] md:pb-[100px] px-container-padding flex flex-col gap-chat-gap max-w-4xl mx-auto w-full" id="chat-container">
<!-- Empty State Suggestions -->
<div class="flex flex-col items-center justify-center h-full mt-xl" id="empty-state">
<span class="material-symbols-outlined text-[64px] text-primary/20 mb-md" data-weight="fill" style="font-variation-settings: 'FILL' 1;">assured_workload</span>
<h2 class="text-headline-xl-mobile md:text-headline-xl font-headline-xl text-center mb-lg">How can I help you <br/>invest today?</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md w-full mt-xl">
<button class="suggestion-btn glass-panel p-md rounded-lg text-left hover:bg-white/10 transition-all hover:scale-[1.02] active:scale-95 group flex flex-col justify-between min-h-[120px]">
<span class="text-body-md font-body-md group-hover:text-primary transition-colors">What is the expense ratio for HDFC Mid Cap?</span>
<span class="material-symbols-outlined self-end text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="suggestion-btn glass-panel p-md rounded-lg text-left hover:bg-white/10 transition-all hover:scale-[1.02] active:scale-95 group flex flex-col justify-between min-h-[120px]">
<span class="text-body-md font-body-md group-hover:text-primary transition-colors">What's the exit load for the Small Cap fund?</span>
<span class="material-symbols-outlined self-end text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="suggestion-btn glass-panel p-md rounded-lg text-left hover:bg-white/10 transition-all hover:scale-[1.02] active:scale-95 group flex flex-col justify-between min-h-[120px]">
<span class="text-body-md font-body-md group-hover:text-primary transition-colors">Tell me about the ELSS Tax Saver fund.</span>
<span class="material-symbols-outlined self-end text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Chat messages will be injected here -->
</main>
<!-- Input Area -->
<div class="fixed bottom-[80px] md:bottom-0 left-0 w-full z-40 bg-gradient-to-t from-background via-background to-transparent pb-md pt-xl px-container-padding">
<div class="max-w-4xl mx-auto relative">
<form class="relative flex items-center" id="chat-form">
<input class="w-full bg-surface-container-highest/80 backdrop-blur-md border border-white/10 rounded-full py-4 pl-6 pr-16 text-body-md focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent placeholder-on-surface-variant transition-shadow shadow-[0_0_15px_rgba(168,85,247,0.05)] focus:shadow-[0_0_20px_rgba(168,85,247,0.15)] text-on-surface" id="chat-input" placeholder="Ask about HDFC Mutual Funds..." type="text"/>
<button class="absolute right-2 p-2 gradient-btn rounded-full flex items-center justify-center w-10 h-10 shadow-lg active:scale-95" type="submit">
<span class="material-symbols-outlined text-white" data-icon="send">send</span>
</button>
</form>
</div>
</div>
<!-- BottomNavBar (Mobile Only) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe bg-surface-container/90 dark:bg-surface-container/90 backdrop-blur-xl border-t border-white/5 shadow-[0_-8px_30px_rgb(0,0,0,0.12)] md:hidden rounded-t-lg">
<a class="flex flex-col items-center justify-center text-primary font-bold active:scale-95 duration-200 w-1/3" href="#">
<span class="material-symbols-outlined" data-icon="chat_bubble" data-weight="fill" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="text-label-sm font-label-sm mt-1">Chat</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 active:scale-95 duration-200 w-1/3" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="text-label-sm font-label-sm mt-1">Portfolio</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 active:scale-95 duration-200 w-1/3" href="#">
<span class="material-symbols-outlined" data-icon="trending_up">trending_up</span>
<span class="text-label-sm font-label-sm mt-1">Markets</span>
</a>
</nav>
<!-- Toast Notification (Hidden by default) -->
<div class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-error-container text-on-error-container px-md py-sm rounded-full shadow-lg border border-error/20 flex items-center gap-sm opacity-0 pointer-events-none transition-opacity duration-300 z-50" id="toast">
<span class="material-symbols-outlined text-error" data-icon="error">error</span>
<span class="text-label-sm font-label-sm" id="toast-message">Failed to connect to API.</span>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatForm = document.getElementById('chat-form');
            const chatInput = document.getElementById('chat-input');
            const chatContainer = document.getElementById('chat-container');
            const emptyState = document.getElementById('empty-state');
            const suggestionBtns = document.querySelectorAll('.suggestion-btn');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');

            function showToast(message) {
                toastMessage.textContent = message;
                toast.classList.remove('opacity-0');
                setTimeout(() => {
                    toast.classList.add('opacity-0');
                }, 3000);
            }

            function appendUserMessage(text) {
                emptyState.style.display = 'none';
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message-enter self-end max-w-[85%] md:max-w-[70%]';
                msgDiv.innerHTML = `
                    <div class="user-bubble rounded-2xl rounded-tr-sm px-lg py-md shadow-[0_4px_20px_rgba(168,85,247,0.15)]">
                        <p class="text-body-md font-body-md">${text}</p>
                    </div>
                `;
                chatContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            function appendLoadingIndicator() {
                const msgDiv = document.createElement('div');
                msgDiv.id = 'loading-indicator';
                msgDiv.className = 'message-enter self-start max-w-[85%] md:max-w-[70%]';
                msgDiv.innerHTML = `
                    <div class="glass-panel rounded-2xl rounded-tl-sm px-lg py-md flex items-center gap-1">
                        <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <circle class="typing-dot" cx="4" cy="12" r="3" />
                            <circle class="typing-dot" cx="12" cy="12" r="3" />
                            <circle class="typing-dot" cx="20" cy="12" r="3" />
                        </svg>
                    </div>
                `;
                chatContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            function removeLoadingIndicator() {
                const indicator = document.getElementById('loading-indicator');
                if (indicator) indicator.remove();
            }

            function appendBotMessage(data) {
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message-enter self-start max-w-[85%] md:max-w-[70%] w-full';
                
                let refusalStyle = '';
                let refusalIcon = '';
                if (data.refused) {
                    refusalStyle = 'border-error/50 shadow-[0_0_15px_rgba(255,180,171,0.1)]';
                    refusalIcon = `<span class="material-symbols-outlined text-error mb-2 block" data-icon="warning">warning</span>`;
                }

                let citationsHTML = '';
                if (data.citations && data.citations.length > 0) {
                    const pills = data.citations.map(c => `
                        <a href="${c.url || '#'}" class="inline-flex items-center gap-xs px-2 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] font-label-sm text-on-surface-variant hover:bg-white/10 transition-colors mt-2">
                            <span class="material-symbols-outlined text-[12px]" data-icon="link">link</span>
                            ${c.source} ${c.date ? `(${c.date})` : ''}
                        </a>
                    `).join('');
                    citationsHTML = `<div class="flex flex-wrap gap-2 mt-3">${pills}</div>`;
                }

                msgDiv.innerHTML = `
                    <div class="glass-panel rounded-2xl rounded-tl-sm px-lg py-md ${refusalStyle}">
                        ${refusalIcon}
                        <p class="text-body-md font-body-md leading-relaxed text-on-surface whitespace-pre-wrap">${data.message}</p>
                        ${citationsHTML}
                    </div>
                `;
                chatContainer.appendChild(msgDiv);
                scrollToBottom();
            }

            function scrollToBottom() {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            async function sendMessage(text) {
                if (!text.trim()) return;
                
                appendUserMessage(text);
                chatInput.value = '';
                appendLoadingIndicator();

                // Mock API Call for UI demonstration
                setTimeout(() => {
                    removeLoadingIndicator();
                    
                    // Simulate a refusal based on keywords
                    const isRefused = text.toLowerCase().includes('guarantee') || text.toLowerCase().includes('stock tip');
                    
                    const mockResponse = {
                        message: isRefused ? 
                            "I cannot provide guaranteed returns or specific stock tips. My answers are based solely on official HDFC Mutual Fund documents and performance history." : 
                            "Based on the latest scheme information document, the HDFC Mid-Cap Opportunities Fund has an expense ratio of 1.45% for the regular plan and 0.85% for the direct plan.",
                        refused: isRefused,
                        citations: isRefused ? [] : [
                            { source: "Scheme Info Document", url: "#", date: "Oct 2023" }
                        ]
                    };

                    appendBotMessage(mockResponse);

                }, 1500);

                /* Real API Implementation 
                try {
                    const response = await fetch('http://localhost:8000/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });
                    
                    if (!response.ok) throw new Error('API Error');
                    
                    const data = await response.json();
                    removeLoadingIndicator();
                    appendBotMessage(data);
                } catch (error) {
                    removeLoadingIndicator();
                    showToast('Failed to reach assistant. Please try again.');
                }
                */
            }

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                sendMessage(chatInput.value);
            });

            suggestionBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const text = btn.querySelector('span').textContent;
                    sendMessage(text);
                });
            });
        });
    </script>
</body></html>
