[build]
builder = "NIXPACKS"
nixpacksPlan = { phases = { setup = { nixPkgs = ["python311", "gcc"] }, install = { cmds = ["python -m venv /opt/venv", ". /opt/venv/bin/activate", "pip install -r backend/requirements.txt"] } } }

[deploy]
startCommand = "bash backend/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
